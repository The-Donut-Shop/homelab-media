# beets config for the lyrics container. beets is used ONLY as an index so that
# beets-getlrc knows which tracks exist; it must never touch the audio files.
directory: /music
library: /config/library.db

import:
  copy: no
  move: no
  link: no
  hardlink: no
  write: no
  autotag: no
  incremental: no            # albums arrive track by track; re-check their folders
  duplicate_action: merge    # new tracks of a known album are merged into it
  quiet: yes
  resume: no
  log: /config/import.log

plugins: getlrc
# (featured artists are stripped in the index by /usr/local/bin/normalize_feat.py,
#  because ftintitle only splits when the track artist starts with the album artist)

getlrc:
  overwrite: no              # never replace an existing .lrc
  workers: 1                 # one lookup at a time: parallel lookups errored on this host
  delay: 0.5                 # be polite to lrclib.net
  retries: 3
  recheck_days: 1            # retry misses/errors daily (default 30)
  fallback_to_plain_lrc: yes # if no synced lyrics exist, write plain lyrics as .lrc
